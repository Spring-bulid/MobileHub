[package]
name = "mobilehub-core"
version = "1.0.0"
edition = "2021"

[lib]
name = "mobilehub_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ureq = { version = "2.10", features = ["gzip"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
